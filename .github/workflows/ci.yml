name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  plugin:
    name: Plugin checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The plugin is one ESM file with node: builtins only, so its suite needs no
      # install step: it boots the plugin against a stand-in context and drives the
      # real routes over a loopback socket.
      - name: Offline plugin checks
        run: node test/plugin-check.mjs
      - name: Status mapping checks
        run: node test/status-map-check.mjs
      - name: Generated strings are in sync with the tables
        run: python tools/l10n-build.py --check

  android:
    name: Android tests and APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Git on Windows does not carry the executable bit, and the checkout here is
      # on Linux.
      - name: Make the wrapper executable
        run: chmod +x gradlew
      - name: JVM unit tests
        run: ./gradlew testDebugUnitTest --console=plain
      # Lint is a gate, not a report: it caught a MediaStore collection that only
      # exists on API 29 in a minSdk-26 app, which is the kind of thing no unit
      # test can see.
      - name: Android lint
        run: ./gradlew lintDebug --console=plain
      - name: Assemble the debug APK
        run: ./gradlew assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
